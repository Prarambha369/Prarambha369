name: Update Visitor Counter

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-visitor-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone visitor counter logic
        run: git clone --depth=1 https://github.com/brown9804/github-visitor-counter.git

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd github-visitor-counter
          npm ci

      - name: Run visitor counter
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node github-visitor-counter/update_repo_views_counter.js

      - name: Move metrics file
        run: |
          if [ -f github-visitor-counter/metrics.json ]; then
            mv github-visitor-counter/metrics.json .
          fi

      - name: Clean up
        run: rm -rf github-visitor-counter

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -f metrics.json ]; then
            git add metrics.json
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update visitor count [skip ci]"
            git push
          fi
