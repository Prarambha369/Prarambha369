name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Prarambha369
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kathmandu
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_isocalendar: yes
          filename: github-metrics.svg
          output_action: commit
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore: update github metrics [skip ci]"
